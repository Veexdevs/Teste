name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, arena/fe38b21c-teste]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar ferramentas nativas
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Compilar APK de teste
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolPredictor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
