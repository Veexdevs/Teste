name: Compilar APK 8BallPool

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-8ball-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Remontar e assinar APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout com arquivos grandes
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Instalar ferramentas de empacotamento
        run: sdkmanager "build-tools;35.0.0"

      - name: Remontar APK sem alterar os códigos
        run: python3 .github/scripts/package_apk.py

      - name: Alinhar e assinar APK debug
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-unsigned.apk" \
            "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "dist/8Ball-Pool-Android-V2-5-debug.apk" \
            "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "dist/8Ball-Pool-Android-V2-5-debug.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "dist/8Ball-Pool-Android-V2-5-debug.apk"
          sha256sum "dist/8Ball-Pool-Android-V2-5-debug.apk" > "dist/8Ball-Pool-Android-V2-5-debug.apk.sha256"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-Pool-Android-V2-5-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
