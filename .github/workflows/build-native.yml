name: build-native
# Compila os pacotes nativos. Nada de HTML/Web: apenas APK, EXE, Linux,
# macOS e o projecto Xcode de iOS. Publica tudo num GitHub Release.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-native.yml'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'icon.png'
      - 'game/**'
      - 'certs/**'
      - 'tools/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GODOT_VERSION: "4.5-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 (apksigner / keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detectar Android SDK
        id: android
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -d "$SDK" || true
          if [ ! -f "$SDK/platform-tools/adb" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "SDK incompleto: a instalar platform-tools e build-tools"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          ls -l "$SDK/platform-tools/adb"
          find "$SDK/build-tools" -maxdepth 2 -name apksigner -type f | head -5
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

      - name: Descarregar Godot 4.5 (editor + templates)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot && cd /tmp/godot
          curl -fsSL --retry 3 -o editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q -o editor.zip
          BIN="$(find . -maxdepth 1 -name 'Godot_v4.5-stable_linux.x86_64' -type f | head -1)"
          cp "$BIN" editor_bin && chmod +x editor_bin
          curl -fsSL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.stable"
          unzip -q -o templates.tpz -d tpz
          cp -r tpz/templates/. "$HOME/.local/share/godot/export_templates/4.5.stable/"
          ./editor_bin --headless --version

      - name: Configurar Editor Settings (Android)
        shell: bash
        run: |
          set -euo pipefail
          JAVA_SDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")}"
          SDK="${{ steps.android.outputs.sdk }}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/certs/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "JAVA_SDK=$JAVA_SDK  SDK=$SDK"
          cat "$HOME/.config/godot/editor_settings-4.5.tres"

      - name: Validar projecto (selftest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds
          /tmp/godot/editor_bin --headless --fixed-fps 60 --path . --quit-after 900 -- --selftest 2>&1 | tee /tmp/selftest.log
          grep -q SELFTEST_PASS /tmp/selftest.log

      - name: Exportar pacotes nativos
        shell: bash
        run: |
          set -euo pipefail
          G=/tmp/godot/editor_bin
          "$G" --headless --path . --export-debug   "Android"         builds/SENTINELA.apk
          "$G" --headless --path . --export-release "Windows Desktop" builds/SENTINELA.exe
          "$G" --headless --path . --export-release "Linux"           builds/SENTINELA.x86_64
          "$G" --headless --path . --export-release "macOS"           builds/SENTINELA_macos.zip
          "$G" --headless --path . --export-release "iOS"             builds/SENTINELA_ios.ipa
          cd builds
          zip -q -r -y SENTINELA_ios_xcode.zip \
            SENTINELA_ios SENTINELA_ios.pck SENTINELA_ios.xcodeproj \
            SENTINELA_ios.xcframework MoltenVK.xcframework PrivacyInfo.xcprivacy
          cd ..
          ls -lh builds/

      - name: Verificar artefactos
        shell: bash
        run: |
          set -euo pipefail
          APK=builds/SENTINELA.apk
          APKSIGNER="$(find "${{ steps.android.outputs.sdk }}/build-tools" -type f -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --verbose "$APK" | tee /tmp/verify.log
          grep -q "Verified using v2 scheme.*true\|Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.log
          echo "Modelos glTF dentro do APK:"
          unzip -l "$APK" | grep 'assets/game/assets/models' | tee /tmp/models.log
          test "$(wc -l < /tmp/models.log)" -ge 9
          chmod +x builds/SENTINELA.x86_64
          ./builds/SENTINELA.x86_64 --headless --fixed-fps 60 --quit-after 900 -- --selftest 2>&1 | tee /tmp/linux_selftest.log
          grep -q SELFTEST_PASS /tmp/linux_selftest.log
          unzip -t builds/SENTINELA_macos.zip | tail -2
          unzip -t builds/SENTINELA_ios_xcode.zip | tail -2

      - name: Upload de artefactos
        uses: actions/upload-artifact@v4
        with:
          name: sentinela-native-builds
          path: |
            builds/SENTINELA.apk
            builds/SENTINELA.exe
            builds/SENTINELA.x86_64
            builds/SENTINELA_macos.zip
            builds/SENTINELA_ios_xcode.zip
          retention-days: 30

      - name: Publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          NOTES="SENTINELA - Operacao Cerrado (Godot 4.5, nativo). APK assinado para Android, EXE Windows, binario Linux, app macOS e projecto Xcode para iOS. Sem export Web/HTML."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              builds/SENTINELA.apk builds/SENTINELA.exe builds/SENTINELA.x86_64 \
              builds/SENTINELA_macos.zip builds/SENTINELA_ios_xcode.zip --clobber
          else
            gh release create "$TAG" \
              builds/SENTINELA.apk builds/SENTINELA.exe builds/SENTINELA.x86_64 \
              builds/SENTINELA_macos.zip builds/SENTINELA_ios_xcode.zip \
              --title "SENTINELA 1.0.0 - builds nativos" --notes "$NOTES"
          fi

      - name: Relatorio de build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          { echo "build $(date -u)"; echo "godot=$(/tmp/godot/editor_bin --headless --version)";
            echo "runner=$RUNNER_OS";
            for f in builds/SENTINELA.apk builds/SENTINELA.exe builds/SENTINELA.x86_64 builds/SENTINELA_macos.zip builds/SENTINELA_ios_xcode.zip; do
              printf '%s %s bytes sha256=%s\n' "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d" " -f1)"; done; } > ci/build-report.txt
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f ci/build-report.txt
          git commit -m "ci: native build report [skip ci]" || true
          git push || true
