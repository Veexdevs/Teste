name: Diagnosticar APK 8BallPool

on:
  workflow_dispatch:
  push:
    branches: [arena/4496a906-teste]
    paths:
      - .github/workflows/diagnose-apk.yml
      - .github/scripts/repackage_preserve.py

permissions:
  contents: read

concurrency:
  group: diagnose-8ball-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Gerar variantes e relatório sem ler códigos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout com arquivos grandes
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Instalar ferramentas de empacotamento
        run: sdkmanager "build-tools;35.0.0"

      - name: Preparar variantes
        run: |
          set -euo pipefail
          mkdir -p dist report
          python3 .github/scripts/repackage_preserve.py \
            --preserve-v1 \
            --output "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-preserve-v1.apk" \
            --report report/preserve-v1-packaging.json
          python3 .github/scripts/repackage_preserve.py \
            --output "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-debug-unsigned.apk" \
            --report report/debug-packaging.json

      - name: Alinhar, assinar e verificar metadados
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          align() { "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$1" "$2"; }
          verify() { "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$1" > "$2" 2>&1; }
          badge() { "$BUILD_TOOLS/aapt2" dump badging "$1" > "$2" 2>&1; }

          align "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-preserve-v1.apk" "dist/8Ball-Pool-Android-V2-5-preserve-v1.apk"
          set +e
          verify "dist/8Ball-Pool-Android-V2-5-preserve-v1.apk" report/preserve-v1-signature.txt
          echo "$?" > report/preserve-v1-signature.exit
          badge "dist/8Ball-Pool-Android-V2-5-preserve-v1.apk" report/preserve-v1-badging.txt
          echo "$?" > report/preserve-v1-badging.exit
          set -e

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          align "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-debug-unsigned.apk" "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-debug-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "dist/8Ball-Pool-Android-V2-5-debug.apk" \
            "$RUNNER_TEMP/8Ball-Pool-Android-V2-5-debug-aligned.apk"
          verify "dist/8Ball-Pool-Android-V2-5-debug.apk" report/debug-signature.txt
          badge "dist/8Ball-Pool-Android-V2-5-debug.apk" report/debug-badging.txt

          verify "assets/SignatureKiller/origin.apk" report/origin-signature.txt || true
          badge "assets/SignatureKiller/origin.apk" report/origin-badging.txt || true
          sha256sum dist/*.apk > report/sha256.txt
          python3 - <<'PY'
          import json, pathlib
          report = pathlib.Path('report')
          summary = []
          for name in ['preserve-v1', 'debug', 'origin']:
              sig = report / f'{name}-signature.txt'
              bad = report / f'{name}-badging.txt'
              summary.append(f'## {name}')
              if sig.exists():
                  text = sig.read_text(errors='replace')
                  summary.append('```text\n' + '\n'.join(text.splitlines()[:25]) + '\n```')
              if bad.exists():
                  lines = [line for line in bad.read_text(errors='replace').splitlines()
                           if line.startswith(('package:', 'sdkVersion:', 'targetSdkVersion:', 'native-code:', 'application-label:', 'launchable-activity:'))]
                  summary.append('```text\n' + '\n'.join(lines[:20]) + '\n```')
          pathlib.Path('report/summary.md').write_text('\n\n'.join(summary), encoding='utf-8')
          PY
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
          preserve_exit=$(cat report/preserve-v1-signature.exit)
          if [ "$preserve_exit" = "0" ]; then
            echo "::notice title=Assinatura v1 preservada::apksigner verify retornou sucesso para a variante preserve-v1."
          else
            echo "::error title=Assinatura v1 preservada::apksigner verify falhou para a variante preserve-v1 (exit=$preserve_exit). Veja o artefato de diagnóstico."
          fi
          grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:|launchable-activity:)' report/preserve-v1-badging.txt | head -n 10 | while IFS= read -r line; do
            echo "::notice title=Metadados preserve-v1::$line"
          done

      - name: Publicar relatório e variantes
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-Pool-Android-V2-5-diagnostico
          path: |
            dist/*.apk
            report/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
