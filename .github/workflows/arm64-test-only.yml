name: Teste ARM64 de APK existente

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da pré-release com o APK compat
        required: true
        default: v2.5-compat-41447529163
  push:
    branches: [arena/7a59dd82-teste]
    paths:
      - .github/workflows/arm64-test-only.yml
      - .github/scripts/emulator-crash-test.sh

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar ADB
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          adb version

      - name: Baixar APK da pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ github.event.inputs.tag || 'v2.5-compat-41447529163' }}" --repo "${{ github.repository }}" \
            --pattern '8Ball-Pool-Android-V2-5-compat.apk' --dir dist --clobber
          cp dist/8Ball-Pool-Android-V2-5-compat.apk dist/8Ball-Pool-Android-V2-5-release-test.apk

      - name: Preparar Redroid
        id: redroid
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p emulator-report "$RUNNER_TEMP/redroid-data"
          {
            echo "## Host ARM64"
            uname -a
            getconf PAGE_SIZE
            docker version --format '{{.Server.Arch}}' || true
            adb version || true
          } > emulator-report/host.txt
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder || true
          sudo modprobe ashmem_linux || true
          docker pull redroid/redroid:14.0.0_64only-latest
          docker run -d --privileged --name redroid-test \
            -v "$RUNNER_TEMP/redroid-data:/data" \
            -p 127.0.0.1:5555:5555 \
            redroid/redroid:14.0.0_64only-latest \
            androidboot.use_memfd=true \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_fps=30
          for i in $(seq 1 60); do
            adb connect 127.0.0.1:5555 >/dev/null 2>&1 || true
            if adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              echo "Redroid boot completed" | tee -a emulator-report/host.txt
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 300 redroid-test > emulator-report/redroid-docker.log 2>&1 || true
          adb devices -l >> emulator-report/host.txt 2>&1 || true
          sudo dmesg | tail -n 120 > emulator-report/dmesg-tail.txt 2>&1 || true
          echo "Redroid did not boot in time" | tee -a emulator-report/host.txt
          exit 1

      - name: Instalar e iniciar APKs
        if: always()
        run: |
          set -uo pipefail
          export ANDROID_SERIAL=127.0.0.1:5555
          adb devices -l > emulator-report/adb-devices.txt 2>&1 || true
          bash .github/scripts/emulator-crash-test.sh

      - name: Publicar diagnóstico na pré-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag="${{ github.event.inputs.tag || 'v2.5-compat-41447529163' }}"
          gh release view "$tag" --repo "${{ github.repository }}" --json body --jq .body > existing-body.md
          python3 - <<'PY'
          from pathlib import Path
          text = Path('existing-body.md').read_text(encoding='utf-8')
          for marker in ('## Resultado do teste ARM64', '## Novo teste ARM64'):
              index = text.find(marker)
              if index != -1:
                  text = text[:index]
          Path('release-body.md').write_text(text.rstrip() + '\n\n', encoding='utf-8')
          PY
          {
            echo "## Novo teste ARM64"
            echo
            if [ -f emulator-report/host.txt ]; then
              echo '```text'
              cat emulator-report/host.txt
              echo '```'
            fi
            if [ -f emulator-report/summary.md ]; then
              echo '```text'
              head -c 70000 emulator-report/summary.md
              echo
              echo '```'
            fi
            if [ -f emulator-report/redroid-docker.log ]; then
              echo '```text'
              tail -n 120 emulator-report/redroid-docker.log
              echo '```'
            fi
            if [ -f emulator-report/dmesg-tail.txt ]; then
              echo '```text'
              tail -n 60 emulator-report/dmesg-tail.txt
              echo '```'
            fi
          } >> release-body.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('release-body.md')
          text = p.read_text(encoding='utf-8')
          if len(text) > 120000:
              text = text[:120000] + '\n\n[truncated]\n'
          p.write_text(text, encoding='utf-8')
          PY
          gh release edit "$tag" --repo "${{ github.repository }}" --notes-file release-body.md
          tail -n 260 release-body.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-test-report
          path: emulator-report/*
          if-no-files-found: warn

      - name: Encerrar Redroid
        if: always()
        run: docker rm -f redroid-test || true

# diagnostic-refresh
