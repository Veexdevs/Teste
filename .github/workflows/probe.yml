name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Godot editor (network check)
        id: dl
        run: |
          set -x
          mkdir -p /tmp/probe && cd /tmp/probe
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          ls -lh godot.zip
          unzip -o -q godot.zip
          ./Godot_v4.5-stable_linux.x86_64 --headless --version
          keytool -genkeypair -v -keystore /tmp/probe/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 2>&1 | tail -3
          echo "RESULT=OK" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: always()
      - name: Write report
        if: always()
        run: |
          mkdir -p ci
          { echo "probe $(date -u)"; echo "result=${{ steps.dl.outputs.RESULT }}"; echo "runner=$RUNNER_OS"; } > ci/probe-report.txt
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add -f ci/probe-report.txt
          git commit -m "ci: probe report [skip ci]" || true
          git push || true
